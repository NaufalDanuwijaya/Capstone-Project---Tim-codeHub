<script>
/* =========================
   STATE
========================= */
const state = {
  page: 'dashboard',
  sessionId: localStorage.getItem('sessionId') || '',
  userEmail: '',
  // dashboard filters
  dashStart: '',
  dashEnd: '',
  dashUmkm: 'ALL',
  // input
  inUmkm: 'BENGKEL',
  inTanggal: '',
  inType: 'PEMASUKAN',
  inMethod: 'CASH',
  inNominal: '',
  inKet: '',
  // riwayat
  histStart: '',
  histEnd: '',
  histUmkm: 'ALL',
  histPage: 1,
  histPageSize: 10,
  // activity
  logPage: 1,
  logPageSize: 10,
  // admin
  adminKey: localStorage.getItem('adminKey') || '',
};

/* =========================
   UTIL
========================= */
function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmtYMD(isoOrDate){
  const d = (isoOrDate instanceof Date) ? isoOrDate : new Date(isoOrDate);
  if (isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtDT(iso){
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso || '');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return `${dd}/${mm}/${yy} ${hh}:${mi}:${ss}`;
}

function fmtRp(n){
  const v = Number(n || 0);
  return 'Rp ' + v.toLocaleString('id-ID');
}

/* =========================
   TOAST / LOADING / MODAL
========================= */
function toast(msg, ms = 2200){
  const el = document.getElementById('toast');
  if (!el) { alert(msg); return; }

  el.textContent = String(msg || '');
  el.classList.add('show');

  if (toast._t) clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

function showLoading(text){
  const wrap = document.getElementById('loadingWrap');
  const txt = document.getElementById('loadingText');
  if (txt) txt.textContent = text || 'Memuat...';
  if (wrap) wrap.classList.add('show');
}
function hideLoading(){
  const wrap = document.getElementById('loadingWrap');
  if (wrap) wrap.classList.remove('show');
}

function showModal(title, bodyHtml){
  const wrap = document.getElementById('modalWrap');
  const modal = document.getElementById('modal');
  if (!wrap || !modal){
    alert('Modal element tidak ditemukan. Pastikan #modalWrap dan #modal ada di Index.html');
    return;
  }

  modal.innerHTML = `
    <div class="modalHead">
      <div class="modalTitle">${esc(title || '')}</div>
      <button class="iconBtn" id="btnModalClose" aria-label="close">✕</button>
    </div>
    <div class="modalBody">${bodyHtml || ''}</div>
  `;
  wrap.classList.add('show');

  const btnClose = document.getElementById('btnModalClose');
  if (btnClose) btnClose.onclick = hideModal;
  wrap.onclick = (e) => { if (e.target === wrap) hideModal(); };
}
function hideModal(){
  const wrap = document.getElementById('modalWrap');
  if (wrap) wrap.classList.remove('show');
}

/* =========================
   ROUTER / RENDER
========================= */
function mount(){
  const root = document.getElementById('app');
  if (!root) return;

  if (!state.sessionId){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }

  // validate session
  google.script.run
    .withSuccessHandler(res=>{
      if (!res || !res.ok){
        state.sessionId = '';
        localStorage.removeItem('sessionId');
        root.innerHTML = renderLogin();
        bindLogin();
        return;
      }
      state.userEmail = res.email || '';
      root.innerHTML = renderShell();
      bindShell();
      renderPage();
    })
    .withFailureHandler(()=>{
      state.sessionId = '';
      localStorage.removeItem('sessionId');
      root.innerHTML = renderLogin();
      bindLogin();
    })
    .api_validate(state.sessionId);
}

function navigate(page){
  state.page = page;
  renderPage();
}

function renderShell(){
  return `
    <div class="appShell">
      <div class="topbar">
        <button class="iconBtn" id="btnMenu" aria-label="menu">☰</button>
        <div class="brand">Keuangan UMKM</div>
        <div class="badge" id="pageBadge">${esc(state.page)}</div>
        <div class="spacer"></div>
        <button class="btn" id="btnLogout">Logout</button>
      </div>

      <div class="appBody">
        <div class="sidebar" id="sidebar">
          <a class="menuItem" data-page="dashboard" href="#">Dashboard</a>
          <a class="menuItem" data-page="input" href="#">Input Transaksi</a>
          <a class="menuItem" data-page="riwayat" href="#">Riwayat Transaksi</a>
          <a class="menuItem" data-page="activity" href="#">Activity Log</a>
          <a class="menuItem" data-page="akun" href="#">Manage Akun</a>
        </div>

        <div class="main">
          <div class="content" id="content"></div>
        </div>
      </div>
    </div>
  `;
}

function renderPage(){
  const content = document.getElementById('content');
  const badge = document.getElementById('pageBadge');
  if (!content) return;

  if (badge) badge.textContent = state.page;

  // active menu
  document.querySelectorAll('.menuItem').forEach(a=>{
    a.classList.toggle('active', a.dataset.page === state.page);
  });

  if (state.page === 'dashboard') content.innerHTML = renderDashboard();
  if (state.page === 'input') content.innerHTML = renderInput();
  if (state.page === 'riwayat') content.innerHTML = renderRiwayat();
  if (state.page === 'activity') content.innerHTML = renderActivity();
  if (state.page === 'akun') content.innerHTML = renderAkun();

  if (state.page === 'dashboard') { bindDashboard(); loadDashboard(); }
  if (state.page === 'input') { bindInput(); }
  if (state.page === 'riwayat') { bindRiwayat(); loadRiwayat(); }
  if (state.page === 'activity') { bindActivity(); loadActivity(); }
  if (state.page === 'akun') { bindAkun(); }
}

/* =========================
   LOGIN
========================= */
function renderLogin(){
  return `
    <div class="loginWrap">
      <div class="loginCard">
        <div class="loginTitle">Login</div>
        <div class="loginSub">Masuk pakai email & password</div>

        <div class="field">
          <label>Email</label>
          <input id="lgEmail" type="email" placeholder="email@domain.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="lgPass" type="password" placeholder="••••••••" />
        </div>

        <div class="rowBtn">
          <button class="btnPrimary full" id="btnLogin">Masuk</button>
        </div>
      </div>
    </div>
  `;
}

function bindLogin(){
  const btn = document.getElementById('btnLogin');
  if (!btn) return;

  btn.onclick = ()=>{
    const email = document.getElementById('lgEmail')?.value || '';
    const pass = document.getElementById('lgPass')?.value || '';
    if (!email.trim() || !pass) return toast('Email & password wajib diisi');

    showLoading('Login...');
    google.script.run
      .withSuccessHandler(res=>{
        hideLoading();
        if (!res || !res.ok) return toast('Login gagal');
        state.sessionId = res.sessionId;
        localStorage.setItem('sessionId', state.sessionId);
        toast('Berhasil login');
        mount();
      })
      .withFailureHandler(e=>{
        hideLoading();
        toast(e?.message || e);
      })
      .api_login(email, pass);
  };
}

/* =========================
   SHELL BIND
========================= */
function bindShell(){
  document.querySelectorAll('.menuItem').forEach(a=>{
    a.onclick = (e)=>{
      e.preventDefault();
      navigate(a.dataset.page);
      closeMenu();
    };
  });

  const btnLogout = document.getElementById('btnLogout');
  if (btnLogout){
    btnLogout.onclick = ()=>{
      state.sessionId = '';
      localStorage.removeItem('sessionId');
      toast('Logout');
      mount();
    };
  }

  // menu
  const btnMenu = document.getElementById('btnMenu');
  if (btnMenu) btnMenu.onclick = ()=> toggleMenu();

  const overlay = document.getElementById('overlay');
  if (overlay) overlay.onclick = ()=> closeMenu();
}

function toggleMenu(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (!sb || !ov) return;
  const open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
function closeMenu(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (!sb || !ov) return;
  sb.classList.remove('open');
  ov.classList.remove('show');
}

/* =========================
   DASHBOARD
========================= */
function renderDashboard(){
  return `
    <div class="card">
      <div class="cardTitle">Dashboard</div>
      <div class="cardSub">Ringkasan dan filter</div>

      <div class="grid2">
        <div class="field">
          <label>Dari</label>
          <input id="dStart" type="date" value="${esc(state.dashStart)}" />
        </div>
        <div class="field">
          <label>Sampai</label>
          <input id="dEnd" type="date" value="${esc(state.dashEnd)}" />
        </div>
      </div>

      <div class="field">
        <label>UMKM</label>
        <select id="dUmkm">
          <option value="ALL">Semua</option>
          <option value="BENGKEL">Bengkel</option>
          <option value="CUCIAN">Cucian</option>
        </select>
      </div>

      <div class="rowBtn">
        <button class="btn full" id="btnDashApply">Terapkan</button>
        <button class="btn full" id="btnDashReset">Reset</button>
        <button class="btnPrimary full" id="btnPdf">Print PDF</button>
        <button class="btnPrimary full" id="btnXlsx">Export Excel</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="miniLabel">Total Pemasukan</div>
        <div class="bigNumber" id="sumIn">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Total Pengeluaran</div>
        <div class="bigNumber" id="sumOut">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Laba</div>
        <div class="bigNumber" id="sumProfit">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Rugi</div>
        <div class="bigNumber" id="sumLoss">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Saldo Awal</div>
        <div class="bigNumber" id="saldoAwal">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Saldo Akhir</div>
        <div class="bigNumber" id="saldoAkhir">0</div>
      </div>
      <div class="card">
        <div class="miniLabel">Jumlah Transaksi</div>
        <div class="bigNumber" id="txCount">0</div>
      </div>
    </div>
  `;
}

function bindDashboard(){
  const dUmkm = document.getElementById('dUmkm');
  if (dUmkm) dUmkm.value = state.dashUmkm;

  document.getElementById('btnDashApply').onclick = ()=>{
    state.dashStart = document.getElementById('dStart')?.value || '';
    state.dashEnd = document.getElementById('dEnd')?.value || '';
    state.dashUmkm = document.getElementById('dUmkm')?.value || 'ALL';
    loadDashboard();
  };

  document.getElementById('btnDashReset').onclick = ()=>{
    state.dashStart = '';
    state.dashEnd = '';
    state.dashUmkm = 'ALL';
    mount(); // refresh page cepat
  };

  document.getElementById('btnPdf').onclick = ()=> exportReport('pdf');
  document.getElementById('btnXlsx').onclick = ()=> exportReport('xlsx');
}

function loadDashboard(){
  showLoading('Memuat dashboard...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const x = res || {};
      document.getElementById('sumIn').textContent = fmtRp(x.totalIn || 0);
      document.getElementById('sumOut').textContent = fmtRp(x.totalOut || 0);
      document.getElementById('sumProfit').textContent = fmtRp(x.profit || 0);
      document.getElementById('sumLoss').textContent = fmtRp(x.loss || 0);
      document.getElementById('saldoAwal').textContent = fmtRp(x.saldoAwal || 0);
      document.getElementById('saldoAkhir').textContent = fmtRp(x.saldoAkhir || 0);
      document.getElementById('txCount').textContent = String(x.count || 0);
    })
    .withFailureHandler(e=>{
      hideLoading();
      toast(e?.message || e);
    })
    .api_dashboard(state.sessionId, {
      start: state.dashStart,
      end: state.dashEnd,
      umkm: state.dashUmkm
    });
}

function exportReport(format){
  const w = window.open('about:blank', '_blank');

  showLoading('Membuat file laporan...');

  google.script.run
    .withSuccessHandler(res => {
      hideLoading();

      const safe = res || {};
      const dl = safe.downloadUrl || safe.download || '';
      const view = safe.fileUrl || safe.url || '';
      const target = dl || view;

      if (!target) {
        if (w) w.document.write('Link download tidak ada');
        showToast('Link download tidak ada');
        console.log('[exportReport] response:', safe);
        return;
      }

      // jangan sampai error toast bikin redirect gagal
      try { showToast('Berhasil dibuat'); } catch(e){}

      if (w) w.location.href = target;
      else window.location.href = target;
    })
    .withFailureHandler(e => {
      hideLoading();
      const msg = (e && e.message) ? e.message : String(e);
      if (w) w.document.write('Error: ' + msg);
      alert(msg);
    })
    .api_exportReport(state.sessionId, {
      format,
      umkm: state.dashUmkm,
      start: state.dashStart,
      end: state.dashEnd
    });
}

// ===== TOAST (safe) =====
function showToast(msg, ms = 2200){
  const el = document.getElementById('toast');
  if (!el) { alert(msg); return; }

  el.textContent = String(msg || '');
  el.classList.add('show');

  if (showToast._t) clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), ms);
}

// alias biar aman kalau ada code lain manggil toast()
function toast(msg, ms = 2200){
  return showToast(msg, ms);
}



/* =========================
   INPUT TRANSAKSI
========================= */
function renderInput(){
  return `
    <div class="card">
      <div class="cardTitle">Input Transaksi</div>
      <div class="cardSub">Isi data transaksi lalu simpan</div>

      <div class="grid2">
        <div class="field">
          <label>UMKM</label>
          <select id="inUmkm">
            <option value="BENGKEL">Bengkel</option>
            <option value="CUCIAN">Cucian</option>
          </select>
        </div>

        <div class="field">
          <label>Tanggal</label>
          <input id="inTanggal" type="date" value="${esc(state.inTanggal)}" />
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label>Tipe</label>
          <select id="inType">
            <option value="PEMASUKAN">Pemasukan</option>
            <option value="PENGELUARAN">Pengeluaran</option>
          </select>
        </div>

        <div class="field">
          <label>Metode Pembayaran</label>
          <select id="inMethod">
            <option value="CASH">Cash</option>
            <option value="TRANSFER">Transfer</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Nominal</label>
        <input id="inNominal" inputmode="numeric" placeholder="contoh: 50000" value="${esc(state.inNominal)}" />
      </div>

      <div class="field">
        <label>Keterangan (opsional)</label>
        <input id="inKet" placeholder="contoh: Ganti oli" value="${esc(state.inKet)}" />
      </div>

      <div class="rowBtn">
        <button class="btnPrimary full" id="btnSaveTx">Simpan</button>
      </div>
    </div>
  `;
}

function bindInput(){
  document.getElementById('inUmkm').value = state.inUmkm;
  document.getElementById('inType').value = state.inType;
  document.getElementById('inMethod').value = state.inMethod;

  // format nominal saat blur
  const inNom = document.getElementById('inNominal');
  if (inNom){
    inNom.onblur = ()=>{
      const digits = String(inNom.value||'').replace(/[^\d]/g,'');
      if (!digits) return;
      inNom.value = Number(digits).toLocaleString('id-ID');
    };
  }

  document.getElementById('btnSaveTx').onclick = ()=>{
    const payload = {
      umkm: document.getElementById('inUmkm')?.value || '',
      tanggal: document.getElementById('inTanggal')?.value || '',
      type: document.getElementById('inType')?.value || '',
      method: document.getElementById('inMethod')?.value || '',
      nominal: document.getElementById('inNominal')?.value || '',
      keterangan: document.getElementById('inKet')?.value || '',
    };

    if (!payload.tanggal) return toast('Tanggal wajib diisi');
    if (!payload.nominal) return toast('Nominal wajib diisi');

    showLoading('Menyimpan transaksi...');
    google.script.run
      .withSuccessHandler(()=>{
        hideLoading();
        toast('Berhasil disimpan');

        // reset field setelah sukses
        document.getElementById('inTanggal').value = '';
        document.getElementById('inNominal').value = '';
        document.getElementById('inKet').value = '';
        // keep pilihan dropdown (biar nyaman)
      })
      .withFailureHandler(e=>{
        hideLoading();
        toast(e?.message || e);
      })
      .api_addTx(state.sessionId, payload);
  };
}

/* =========================
   RIWAYAT
========================= */
function renderRiwayat(){
  return `
    <div class="card">
      <div class="cardTitle">Filter Riwayat</div>
      <div class="cardSub">Atur periode dan UMKM, lalu tekan Terapkan</div>

      <div class="grid2">
        <div class="field">
          <label>Dari</label>
          <input id="hStart" type="date" value="${esc(state.histStart)}">
        </div>
        <div class="field">
          <label>Sampai</label>
          <input id="hEnd" type="date" value="${esc(state.histEnd)}">
        </div>
      </div>

      <div class="field">
        <label>UMKM</label>
        <select id="hUmkm">
          <option value="ALL">Semua</option>
          <option value="BENGKEL">Bengkel</option>
          <option value="CUCIAN">Cucian</option>
        </select>
      </div>

      <div class="rowBtn">
        <button class="btn" id="btnHistApply">Terapkan</button>
        <button class="btn" id="btnHistReset">Reset</button>
      </div>
    </div>

    <div class="card">
      <div id="histList" class="empty">Memuat data...</div>

      <div class="pager">
        <button class="btn" id="btnPrev">Prev</button>
        <button class="btn" id="btnNext">Next</button>
        <div class="pagerInfo">Page: <b id="pno">${state.histPage}</b></div>
      </div>
    </div>
  `;
}

function bindRiwayat(){
  const hUmkm = document.getElementById('hUmkm');
  if (hUmkm) hUmkm.value = state.histUmkm;

  document.getElementById('btnHistApply').onclick = ()=>{
    state.histStart = document.getElementById('hStart')?.value || '';
    state.histEnd = document.getElementById('hEnd')?.value || '';
    state.histUmkm = document.getElementById('hUmkm')?.value || 'ALL';
    state.histPage = 1;
    loadRiwayat();
  };

  document.getElementById('btnHistReset').onclick = ()=>{
    state.histStart = '';
    state.histEnd = '';
    state.histUmkm = 'ALL';
    state.histPage = 1;
    document.getElementById('hStart').value = '';
    document.getElementById('hEnd').value = '';
    document.getElementById('hUmkm').value = 'ALL';
    loadRiwayat();
  };

  document.getElementById('btnPrev').onclick = ()=>{
    if (state.histPage <= 1) return;
    state.histPage--;
    loadRiwayat();
  };

  document.getElementById('btnNext').onclick = ()=>{
    state.histPage++;
    loadRiwayat();
  };
}

function txCard(tx){
  const txId = tx?.txId || '';
  const tanggal = tx?.date || fmtYMD(tx?.dateObj || tx?.tanggal);
  const umkm = String(tx?.umkm || '').toUpperCase();
  const tipe = String(tx?.type || '').toUpperCase();
  const method = String(tx?.method || '').toUpperCase();
  const nominal = fmtRp(tx?.amount || tx?.nominal || 0);
  const note = String(tx?.note || tx?.keterangan || '').trim();

  return `
    <div class="txCard">
      <div class="txTitle">${esc(tanggal)} · ${esc(umkm)} · ${esc(tipe)}</div>
      <div class="txMeta">Metode: <b>${esc(method)}</b> · Nominal: <b>${esc(nominal)}</b></div>
      <div class="note">${esc(note || '-')}</div>

      <div class="txBtns">
        <button class="btn" data-act="detail" data-txid="${esc(txId)}">Detail</button>
        <button class="btn" data-act="edit" data-txid="${esc(txId)}">Edit</button>
        <button class="btnDanger" data-act="del" data-txid="${esc(txId)}">Hapus</button>
      </div>
    </div>
  `;
}

function bindRiwayatButtons(){
  const list = document.getElementById('histList');
  if (!list) return;

  list.querySelectorAll('[data-act="detail"]').forEach(btn=>{
    btn.onclick = ()=> openTxDetail(btn.dataset.txid);
  });
  list.querySelectorAll('[data-act="edit"]').forEach(btn=>{
    btn.onclick = ()=> openTxEdit(btn.dataset.txid);
  });
  list.querySelectorAll('[data-act="del"]').forEach(btn=>{
    btn.onclick = ()=> deleteTx(btn.dataset.txid);
  });
}

function loadRiwayat(){
  const histListEl = document.getElementById('histList');
  if (!histListEl) return;

  histListEl.innerHTML = `<div class="empty">Memuat data...</div>`;
  showLoading('Memuat riwayat...');

  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      console.log('[api_listTx] response:', res);

      const safe = res || {};
      const items = Array.isArray(safe.items) ? safe.items : [];

      histListEl.innerHTML =
        `<div class="hint" style="margin-bottom:10px;">Diterima: <b>${items.length}</b> data</div>` +
        (items.length ? items.map(txCard).join('') : `<div class="empty">Tidak ada transaksi</div>`);

      const pnoEl = document.getElementById('pno');
      if (pnoEl) pnoEl.textContent = String(safe.page || state.histPage || 1);

      const nextEl = document.getElementById('btnNext');
      if (nextEl) nextEl.disabled = !safe.hasMore;

      const prevEl = document.getElementById('btnPrev');
      if (prevEl) prevEl.disabled = (state.histPage <= 1);

      bindRiwayatButtons();
    })
    .withFailureHandler(e=>{
      hideLoading();
      console.error('[api_listTx] error:', e);
      histListEl.innerHTML = `<div class="errText">API error: ${esc(e?.message || e)}</div>`;
      toast(e?.message || e);
    })
    .api_listTx(state.sessionId, {
      start: state.histStart,
      end: state.histEnd,
      umkm: state.histUmkm,
      page: state.histPage,
      pageSize: state.histPageSize
    });
}

function openTxDetail(txId){
  if (!txId) return toast('txId kosong');
  showLoading('Memuat detail...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const item = res?.item || res;
      if (!item?.txId) return toast('Data tidak ditemukan');

      showModal('Detail Transaksi', `
        <div class="field"><label>ID</label><div><b>${esc(item.txId)}</b></div></div>
        <div class="grid2">

}

      document.getElementById('eMethod').value = String(item.method || 'CASH').toUpperCase();

      document.getElementById('formEditTx').onsubmit = (ev)=>{

        const payload = {
          txId: item.txId,
          tanggal: document.getElementById('eTanggal')?.value || '',
          umkm: document.getElementById('eUmkm')?.value || '',
          type: document.getElementById('eType')?.value || '',
          method: document.getElementById('eMethod')?.value || '',
          nominal: document.getElementById('eNominal')?.value || '',
          keterangan: document.getElementById('eNote')?.value || ''
        };

        if (!payload.tanggal) return toast('Tanggal wajib diisi');

        showLoading('Menyimpan perubahan...');
        google.script.run
          .withSuccessHandler(()=>{
            hideLoading();
            hideModal();
            toast('Berhasil update');
            loadRiwayat();
          })
          .withFailureHandler(e=>{
            hideLoading();
            toast(e?.message || e);
          })
          .api_updateTx(state.sessionId, payload);
      };
    })
    .withFailureHandler(e=>{
      hideLoading();
      toast(e?.message || e);
    })
    .api_getTx(state.sessionId, txId);
}

/* =========================
   ACTIVITY (tetap versi lama, tapi rapih)
========================= */
function renderActivity(){
  return `
    <div class="card">
      <div class="cardTitle">Activity Log</div>
      <div class="cardSub">Catatan aktivitas sistem</div>
    </div>

    <div class="card">
      <div id="logList"></div>

      <div class="pager">
        <button class="btn" id="btnLogPrev">Prev</button>
        <button class="btn" id="btnLogNext">Next</button>
        <div class="pagerInfo">Page: <b id="lpno">${state.logPage}</b></div>
      </div>
    </div>
  `;
}

function bindActivity(){
  document.getElementById('btnLogPrev').onclick = ()=>{
    if (state.logPage <= 1) return;
    state.logPage--;
    loadActivity();
  };
  document.getElementById('btnLogNext').onclick = ()=>{
    state.logPage++;
    loadActivity();
  };
}

function prettifyAction(action){
  const a = String(action||'');
  if (a.startsWith('API_') && a.endsWith('_OK')) return `Berhasil`;
  if (a.startsWith('API_') && a.endsWith('_ERR')) return `Gagal`;
  if (a === 'ADMIN_USER_ADD') return 'Tambah akun';
  if (a === 'ADMIN_USER_EDIT') return 'Edit akun';
  if (a === 'ADMIN_USER_DELETE') return 'Hapus akun';
  return a;
}

function logHuman(action, detailObj){
  const a = String(action||'');

  // halaman akses
  if (a.startsWith('API_') && a.includes('DASHBOARD')) return `Halaman: Dashboard`;
  if (a.startsWith('API_') && a.includes('LIST_TX')) return `Halaman: Riwayat Transaksi`;
  if (a.startsWith('API_') && a.includes('ACTIVITY_LIST')) return `Halaman: Activity Log`;
  if (a.startsWith('API_') && a.includes('USERS_')) return `Halaman: Manage Akun`;

  // transaksi
  if (a.startsWith('API_ADD_TX')){
    const umkm = detailObj?.umkm || '';
    const type = detailObj?.type || '';
    const nominal = detailObj?.nominal || '';
    return `Input transaksi ${umkm} (${type}) nominal ${nominal}`;
  }
  if (a.startsWith('API_UPDATE_TX')){
    return `Update transaksi (perubahan data)`;
  }
  if (a.startsWith('API_DELETE_TX')){
    return `Hapus transaksi`;
  }
  if (a.startsWith('API_EXPORT_REPORT')){
    return `Export laporan`;
  }

  return prettifyAction(action);
}

function loadActivity(){
  const listEl = document.getElementById('logList');
  if (!listEl) return;

  showLoading('Memuat log...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const items = Array.isArray(res?.items) ? res.items : [];

      listEl.innerHTML = items.map(x=>{
        let obj = {};
        try{ obj = JSON.parse(x.detail || '{}'); }catch(e){ obj = {}; }

        const title = logHuman(x.action, obj?.detail || obj);
        const timeText = fmtDT(x.time);
        const email = x.email || '';

        // kalau error, tampilkan pesan ringkas
        const err = obj?.error ? `Error: ${obj.error}` : '';

        // detail ringkas (bukan json mentah)
        let sub = '';
        if (obj?.detail?.start || obj?.detail?.end || obj?.detail?.umkm){
          const s = obj.detail.start || '-';
          const e = obj.detail.end || '-';
          const u = obj.detail.umkm || 'ALL';
          sub = `Periode: ${s} s/d ${e} · UMKM: ${u}`;
        }

        return `
          <div class="logCard ${String(x.action||'').includes('_ERR') ? 'logErr' : ''}">
            <div class="logTop">
              <div class="logAction">${esc(title)}</div>
              <div class="logTime">${esc(timeText)}</div>
            </div>
            <div class="logEmail">${esc(email)}</div>
            <div class="logDetail">${esc(sub || err || '')}</div>
          </div>
        `;
      }).join('') || `<div class="empty">Belum ada log</div>`;

      document.getElementById('lpno').textContent = String(res.page || 1);
      document.getElementById('btnLogNext').disabled = !res.hasMore;
      document.getElementById('btnLogPrev').disabled = state.logPage <= 1;
    })
    .withFailureHandler(e=>{
      hideLoading();
      toast(e?.message || e);
    })
    .api_activityList(state.sessionId, state.logPage, state.logPageSize);
}

/* =========================
   MANAGE AKUN (minimal stable)
========================= */
function renderAkun(){
  return `
    <div class="card">
      <div class="cardTitle">Manage Akun</div>
      <div class="cardSub">Masukkan admin key, lalu simpan untuk membuka fitur admin</div>

      <div class="field">
        <label>Admin Key</label>
        <input id="adminKey" type="password" value="${esc(state.adminKey)}" />
      </div>

      <div class="rowBtn">
        <button class="btnPrimary full" id="btnSaveKey">Simpan Key</button>
      </div>

      <div class="hint" id="adminHint"></div>
    </div>

    <div class="card" id="adminArea" style="display:none;">
      <div class="rowBetween">
        <div>
          <div class="cardTitle">Daftar Akun</div>
          <div class="cardSub">Tambah / edit / hapus akun</div>
        </div>
        <button class="btnPrimary" id="btnAddUser">Tambah Akun</button>
      </div>

      <div id="userList"></div>
    </div>
  `;
}

function bindAkun(){
  document.getElementById('btnSaveKey').onclick = ()=>{
    const key = document.getElementById('adminKey')?.value || '';
    if (!key) return toast('Admin key wajib diisi');
    state.adminKey = key;
    localStorage.setItem('adminKey', key);
    toast('Key disimpan');
    loadUsers();
  };
}

function loadUsers(){
  const hint = document.getElementById('adminHint');
  const area = document.getElementById('adminArea');
  const list = document.getElementById('userList');

  if (!area || !list) return;

  showLoading('Memuat akun...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      if (!Array.isArray(res)) {
        if (hint) hint.textContent = 'Admin key salah.';
        area.style.display = 'none';
        return;
      }

      if (hint) hint.textContent = 'Admin key valid. Kamu bisa kelola akun.';
      area.style.display = 'block';

      list.innerHTML = res.map(u=>`
        <div class="userCard">
          <div class="userTop">
            <div>
              <div class="userName">${esc(u.name)} <span class="muted">(${esc(u.email)})</span></div>
              <div class="muted">Aktif: ${u.isActive ? 'Ya' : 'Tidak'}</div>
            </div>
            <div class="userBadge">${u.isActive ? 'ACTIVE' : 'OFF'}</div>
          </div>
          <div class="txBtns">
            <button class="btn" data-uact="edit" data-uid="${esc(u.userId)}">Edit</button>
            <button class="btnDanger" data-uact="del" data-uid="${esc(u.userId)}">Hapus</button>
          </div>
        </div>
      `).join('') || `<div class="empty">Belum ada akun</div>`;

      document.getElementById('btnAddUser').onclick = ()=> openUserModal();

      list.querySelectorAll('[data-uact="edit"]').forEach(b=>{
        b.onclick = ()=> openUserModal(res.find(x=>x.userId===b.dataset.uid));
      });
      list.querySelectorAll('[data-uact="del"]').forEach(b=>{
        b.onclick = ()=> deleteUser(b.dataset.uid);
      });
    })
    .withFailureHandler(e=>{
      hideLoading();
      toast(e?.message || e);
    })
    .api_usersList(state.sessionId, state.adminKey);
}

function openUserModal(user){
  const isEdit = !!user;
  showModal(isEdit ? 'Edit Akun' : 'Tambah Akun', `
    <form id="frmUser">
      <div class="field">
        <label>Email</label>
        <input id="uEmail" type="email" value="${esc(user?.email || '')}" ${isEdit ? 'disabled' : ''}/>
      </div>
      <div class="field">
        <label>Nama</label>
        <input id="uName" value="${esc(user?.name || '')}"/>
      </div>
      <div class="field">
        <label>Password ${isEdit ? '(kosongkan jika tidak ganti)' : ''}</label>
        <input id="uPass" type="password" />
      </div>
      <div class="field">
        <label>Status</label>
        <select id="uActive">
          <option value="1">Aktif</option>
          <option value="0">Nonaktif</option>
        </select>
      </div>

      <div class="rowBtn">
        <button class="btnPrimary full" type="submit">${isEdit ? 'Simpan Perubahan' : 'Tambah Akun'}</button>
      </div>
    </form>
  `);

  document.getElementById('uActive').value = user?.isActive === false ? '0' : '1';

  document.getElementById('frmUser').onsubmit = (ev)=>{
    ev.preventDefault();

    const payload = {
      userId: user?.userId || '',
      email: (user?.email || document.getElementById('uEmail')?.value || '').trim(),
      name: (document.getElementById('uName')?.value || '').trim(),
      password: document.getElementById('uPass')?.value || '',
      isActive: document.getElementById('uActive')?.value === '1'
    };

    showLoading('Menyimpan akun...');
    google.script.run
      .withSuccessHandler(()=>{
        hideLoading();
        hideModal();
        toast('Berhasil disimpan');
        loadUsers();
      })
      .withFailureHandler(e=>{
        hideLoading();
        toast(e?.message || e);
      })
      .api_usersUpsert(state.sessionId, state.adminKey, payload);
  };
}

function deleteUser(userId){
  if (!confirm('Hapus akun ini?')) return;
  showLoading('Menghapus akun...');
  google.script.run
    .withSuccessHandler(()=>{
      hideLoading();
      toast('Akun dihapus');
      loadUsers();
    })
    .withFailureHandler(e=>{
      hideLoading();
      toast(e?.message || e);
    })
    .api_usersDelete(state.sessionId, state.adminKey, userId);
}

mount();
