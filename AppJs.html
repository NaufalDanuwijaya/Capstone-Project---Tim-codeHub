<script>
/* =========================
   STATE
========================= */
const state = {
  page: 'dashboard',
  sessionId: localStorage.getItem('sessionId') || '',
  userEmail: '',
  userRole: 'ADMIN', 
  // dashboard filters
  dashStart: '',
  dashEnd: '',
  dashUmkm: 'ALL',
  // input
  inUmkm: 'BENGKEL',
  inTanggal: '',
  inType: 'PEMASUKAN',
  inMethod: 'CASH',
  inNominal: '',
  inKet: '',
  // riwayat
  histStart: '',
  histEnd: '',
  histUmkm: 'ALL',
  histPage: 1,
  histPageSize: 10,
  // activity
  logStart: '',
  logEnd: '',
  logUmkm: 'ALL',
  logPage: 1,
  logPageSize: 20, 
  // admin
  adminKey: localStorage.getItem('adminKey') || '',
};

let _chartInstances = {}; 

/* =========================
   UTIL
========================= */
function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmtYMD(isoOrDate){
  const d = (isoOrDate instanceof Date) ? isoOrDate : new Date(isoOrDate);
  if (isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtDT(val){
  if (!val) return '-';
  const s = String(val).trim();
  let parts = s.split(/[- :]/); 
  
  if (parts.length >= 6) {
    const y = parts[0];
    const m = parts[1];
    const d = parts[2];
    const jam = parts[3];
    const min = parts[4];
    const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
    const mIndex = parseInt(m, 10) - 1;
    const monName = monthNames[mIndex] || m;
    return `${d} ${monName} ${y} • ${jam}:${min}`;
  }

  const dObj = new Date(s);
  if (!isNaN(dObj.getTime())) {
    const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
    const dd = String(dObj.getDate()).padStart(2,'0');
    const mm = monthNames[dObj.getMonth()];
    const yy = dObj.getFullYear();
    const hh = String(dObj.getHours()).padStart(2,'0');
    const mi = String(dObj.getMinutes()).padStart(2,'0');
    return `${dd} ${mm} ${yy} • ${hh}:${mi}`;
  }
  return s; 
}

function fmtRp(n){
  const v = Number(n || 0);
  return 'Rp ' + v.toLocaleString('id-ID');
}

/* =========================
   TOAST / LOADING / MODAL
========================= */
function toast(msg, ms = 2200){
  const el = document.getElementById('toast');
  if (!el) { alert(msg); return; }
  el.textContent = String(msg || '');
  el.classList.add('show');
  if (toast._t) clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

function showLoading(text){
  const wrap = document.getElementById('loadingWrap');
  const txt = document.getElementById('loadingText');
  if (txt) txt.textContent = text || 'Memuat...';
  if (wrap) wrap.classList.add('show');
}
function hideLoading(){
  const wrap = document.getElementById('loadingWrap');
  if (wrap) wrap.classList.remove('show');
}

function showModal(title, bodyHtml){
  const wrap = document.getElementById('modalWrap');
  const modal = document.getElementById('modal');
  if (!wrap || !modal){
    alert('Modal element tidak ditemukan. Pastikan #modalWrap dan #modal ada di Index.html');
    return;
  }
  modal.innerHTML = `
    <div class="modalHead">
      <div class="modalTitle">${esc(title || '')}</div>
      <button class="iconBtn" id="btnModalClose" aria-label="close">✕</button>
    </div>
    <div class="modalBody">${bodyHtml || ''}</div>
  `;
  wrap.classList.add('show');
  const btnClose = document.getElementById('btnModalClose');
  if (btnClose) btnClose.onclick = hideModal;
  wrap.onclick = (e) => { if (e.target === wrap) hideModal(); };
}
function hideModal(){
  const wrap = document.getElementById('modalWrap');
  if (wrap) wrap.classList.remove('show');
}

/* =========================
   ROUTER / RENDER
========================= */
function mount(){
  const root = document.getElementById('app');
  if (!root) return;

  if (!state.sessionId){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }

  google.script.run
    .withSuccessHandler(res=>{
      if (!res || !res.ok){
        state.sessionId = '';
        localStorage.removeItem('sessionId');
        root.innerHTML = renderLogin();
        bindLogin();
        return;
      }
      state.userEmail = res.email || '';
      state.userRole = String(res.role || 'ADMIN').toUpperCase();
      
      root.innerHTML = renderShell();
      bindShell();
      
      if (state.userRole !== 'OWNER' && state.page === 'dashboard') {
        state.page = 'input';
      }
      
      renderPage();
    })
    .withFailureHandler(()=>{
      state.sessionId = '';
      localStorage.removeItem('sessionId');
      root.innerHTML = renderLogin();
      bindLogin();
    })
    .api_validate(state.sessionId);
}

function navigate(page){
  state.page = page;
  renderPage();
}

function renderShell(){
  const isOwner = (state.userRole === 'OWNER');
  let menu = '';
  if (isOwner) menu += `<a class="menuItem" data-page="dashboard" href="#">Dashboard</a>`;
  menu += `<a class="menuItem" data-page="input" href="#">Input Transaksi</a>`;
  menu += `<a class="menuItem" data-page="riwayat" href="#">Riwayat Transaksi</a>`;
  if (isOwner) {
    menu += `<a class="menuItem" data-page="activity" href="#">Activity Log</a>`;
    menu += `<a class="menuItem" data-page="akun" href="#">Manage Akun</a>`;
  }

  return `
    <div class="appShell">
      <div class="topbar">
        <button class="iconBtn" id="btnMenu" aria-label="menu">☰</button>
        <div class="brand">Keuangan UMKM <span style="font-size:0.7em; opacity:0.8">(${state.userRole})</span></div>
        <div class="badge" id="pageBadge">${esc(state.page)}</div>
        <div class="spacer"></div>
        <button class="btn" id="btnLogout">Logout</button>
      </div>

      <div class="appBody">
        <div class="sidebar" id="sidebar">${menu}</div>
        <div class="main"><div class="content" id="content"></div></div>
      </div>
    </div>
  `;
}

function renderPage(){
  const content = document.getElementById('content');
  const badge = document.getElementById('pageBadge');
  if (!content) return;

  if (badge) badge.textContent = state.page;

  document.querySelectorAll('.menuItem').forEach(a=>{
    a.classList.toggle('active', a.dataset.page === state.page);
  });

  const isOwner = (state.userRole === 'OWNER');
  if (!isOwner && (state.page === 'dashboard' || state.page === 'activity' || state.page === 'akun')) {
    navigate('input');
    return;
  }

  if (state.page === 'dashboard') content.innerHTML = renderDashboard();
  if (state.page === 'input') content.innerHTML = renderInput();
  if (state.page === 'riwayat') content.innerHTML = renderRiwayat();
  if (state.page === 'activity') content.innerHTML = renderActivity();
  if (state.page === 'akun') content.innerHTML = renderAkun();

  if (state.page === 'dashboard') { bindDashboard(); loadDashboard(); }
  if (state.page === 'input') { bindInput(); }
  if (state.page === 'riwayat') { bindRiwayat(); loadRiwayat(); }
  if (state.page === 'activity') { bindActivity(); loadActivity(); }
  if (state.page === 'akun') { bindAkun(); }
}

/* =========================
   LOGIN
========================= */
function renderLogin(){
  return `
    <div class="loginWrap">
      <div class="loginCard">
        <div class="loginTitle">Login</div>
        <div class="loginSub">Masuk pakai email & password</div>
        <div class="field"><label>Email</label><input id="lgEmail" type="email" placeholder="email@domain.com" /></div>
        <div class="field"><label>Password</label><input id="lgPass" type="password" placeholder="••••••••" /></div>
        <div class="rowBtn"><button class="btnPrimary full" id="btnLogin">Masuk</button></div>
      </div>
    </div>
  `;
}

function bindLogin(){
  const btn = document.getElementById('btnLogin');
  if (!btn) return;
  btn.onclick = ()=>{
    const email = document.getElementById('lgEmail')?.value || '';
    const pass = document.getElementById('lgPass')?.value || '';
    if (!email.trim() || !pass) return toast('Email & password wajib diisi');
    showLoading('Login...');
    google.script.run
      .withSuccessHandler(res=>{
        hideLoading();
        if (!res || !res.ok) return toast('Login gagal');
        state.sessionId = res.sessionId;
        state.userRole = String(res.role || 'ADMIN').toUpperCase();
        localStorage.setItem('sessionId', state.sessionId);
        toast('Berhasil login sebagai ' + state.userRole);
        state.page = (state.userRole === 'OWNER') ? 'dashboard' : 'input';
        mount();
      })
      .withFailureHandler(e=>{ hideLoading(); toast(e?.message || e); })
      .api_login(email, pass);
  };
}

/* =========================
   SHELL BIND
========================= */
function bindShell(){
  document.querySelectorAll('.menuItem').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); navigate(a.dataset.page); closeMenu(); };
  });
  const btnLogout = document.getElementById('btnLogout');
  if (btnLogout) btnLogout.onclick = ()=>{
    state.sessionId = ''; localStorage.removeItem('sessionId'); toast('Logout'); mount();
  };
  const btnMenu = document.getElementById('btnMenu');
  if (btnMenu) btnMenu.onclick = ()=> toggleMenu();
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.onclick = ()=> closeMenu();
}

function toggleMenu(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (!sb || !ov) return;
  const open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
function closeMenu(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (!sb || !ov) return;
  sb.classList.remove('open');
  ov.classList.remove('show');
}

/* =========================
   DASHBOARD
========================= */
function renderDashboard(){
  return `
    <div class="card">
      <div class="cardTitle">Dashboard</div>
      <div class="cardSub">Ringkasan dan filter</div>
      <div class="grid2">
        <div class="field"><label>Dari</label><input id="dStart" type="date" value="${esc(state.dashStart)}" /></div>
        <div class="field"><label>Sampai</label><input id="dEnd" type="date" value="${esc(state.dashEnd)}" /></div>
      </div>
      <div class="field"><label>UMKM</label><select id="dUmkm"><option value="ALL">Semua</option><option value="BENGKEL">Bengkel</option><option value="CUCIAN">Cucian</option></select></div>
      <div class="rowBtn">
        <button class="btn full" id="btnDashApply">Terapkan</button>
        <button class="btn full" id="btnDashReset">Reset</button>
        <button class="btnPrimary full" id="btnPdf">Print PDF</button>
        <button class="btnPrimary full" id="btnXlsx">Export Excel</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card"><div class="miniLabel">Total Pemasukan</div><div class="bigNumber" id="sumIn">0</div></div>
      <div class="card"><div class="miniLabel">Total Pengeluaran</div><div class="bigNumber" id="sumOut">0</div></div>
      <div class="card"><div class="miniLabel">Laba</div><div class="bigNumber" id="sumProfit">0</div></div>
      <div class="card"><div class="miniLabel">Rugi</div><div class="bigNumber" id="sumLoss">0</div></div>
      <div class="card"><div class="miniLabel">Saldo Akhir</div><div class="bigNumber" id="saldoAkhir">0</div></div>
      <div class="card"><div class="miniLabel">Jumlah Transaksi</div><div class="bigNumber" id="txCount">0</div></div>
    </div>

    <div class="card">
      <div class="cardTitle">Tren Arus Kas (Harian)</div>
      <div style="position: relative; height: 300px; width: 100%;">
        <canvas id="chartTrend"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Pertumbuhan Laba (Bulanan)</div>
      <div style="position: relative; height: 300px; width: 100%;">
        <canvas id="chartProfitGrowth"></canvas>
      </div>
    </div>
  `;
}

function bindDashboard(){
  const dUmkm = document.getElementById('dUmkm');
  if (dUmkm) dUmkm.value = state.dashUmkm;
  document.getElementById('btnDashApply').onclick = ()=>{
    state.dashStart = document.getElementById('dStart')?.value || '';
    state.dashEnd = document.getElementById('dEnd')?.value || '';
    state.dashUmkm = document.getElementById('dUmkm')?.value || 'ALL';
    loadDashboard();
  };
  document.getElementById('btnDashReset').onclick = ()=>{
    state.dashStart = ''; state.dashEnd = ''; state.dashUmkm = 'ALL'; mount(); 
  };
  document.getElementById('btnPdf').onclick = ()=> exportReport('pdf');
  document.getElementById('btnXlsx').onclick = ()=> exportReport('xlsx');
}

function loadDashboard(){
  showLoading('Memuat dashboard...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const x = res || {};
      document.getElementById('sumIn').textContent = fmtRp(x.totalIn || 0);
      document.getElementById('sumOut').textContent = fmtRp(x.totalOut || 0);
      document.getElementById('sumProfit').textContent = fmtRp(x.profit || 0);
      document.getElementById('sumLoss').textContent = fmtRp(x.loss || 0);
      document.getElementById('saldoAkhir').textContent = fmtRp(x.saldoAkhir || 0);
      document.getElementById('txCount').textContent = String(x.count || 0);

      if(x.charts) {
        renderCharts_(x.charts);
      }
    })
    .withFailureHandler(e=>{ hideLoading(); toast(e?.message || e); })
    .api_dashboard(state.sessionId, { start: state.dashStart, end: state.dashEnd, umkm: state.dashUmkm });
}

function exportReport(format){
  const w = window.open('about:blank', '_blank');
  showLoading('Membuat file laporan...');
  google.script.run
    .withSuccessHandler(res => {
      hideLoading();
      const safe = res || {};
      const target = safe.downloadUrl || safe.fileUrl;
      if (!target) { if (w) w.close(); return toast('Link download tidak tersedia'); }
      if (w) w.location.href = target; else window.location.href = target;
    })
    .withFailureHandler(e => { hideLoading(); if (w) w.close(); toast(e?.message || e); })
    .api_exportReport(state.sessionId, { format, umkm: state.dashUmkm, start: state.dashStart, end: state.dashEnd });
}

/* =========================
   INPUT TRANSAKSI
========================= */
function renderInput(){
  return `
    <div class="card">
      <div class="cardTitle">Input Transaksi</div>
      <div class="cardSub">Isi data transaksi lalu simpan</div>
      <div class="grid2">
        <div class="field"><label>UMKM</label><select id="inUmkm"><option value="BENGKEL">Bengkel</option><option value="CUCIAN">Cucian</option></select></div>
        <div class="field"><label>Tanggal</label><input id="inTanggal" type="date" value="${esc(state.inTanggal)}" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Tipe</label><select id="inType"><option value="PEMASUKAN">Pemasukan</option><option value="PENGELUARAN">Pengeluaran</option></select></div>
        <div class="field"><label>Metode Pembayaran</label><select id="inMethod"><option value="CASH">Cash</option><option value="TRANSFER">Transfer</option></select></div>
      </div>
      <div class="field"><label>Nominal</label><input id="inNominal" inputmode="numeric" placeholder="contoh: 50000" value="${esc(state.inNominal)}" /></div>
      <div class="field"><label>Keterangan (opsional)</label><input id="inKet" placeholder="contoh: Ganti oli" value="${esc(state.inKet)}" /></div>
      <div class="rowBtn"><button class="btnPrimary full" id="btnSaveTx">Simpan</button></div>
    </div>
  `;
}

function bindInput(){
  document.getElementById('inUmkm').value = state.inUmkm;
  document.getElementById('inType').value = state.inType;
  document.getElementById('inMethod').value = state.inMethod;
  const inNom = document.getElementById('inNominal');
  if (inNom){
    inNom.onblur = ()=>{
      const digits = String(inNom.value||'').replace(/[^\d]/g,'');
      if (!digits) return;
      inNom.value = Number(digits).toLocaleString('id-ID');
    };
  }
  document.getElementById('btnSaveTx').onclick = ()=>{
    const payload = {
      umkm: document.getElementById('inUmkm')?.value || '',
      tanggal: document.getElementById('inTanggal')?.value || '',
      type: document.getElementById('inType')?.value || '',
      method: document.getElementById('inMethod')?.value || '',
      nominal: document.getElementById('inNominal')?.value || '',
      keterangan: document.getElementById('inKet')?.value || '',
    };
    if (!payload.tanggal) return toast('Tanggal wajib diisi');
    if (!payload.nominal) return toast('Nominal wajib diisi');
    showLoading('Menyimpan transaksi...');
    google.script.run
      .withSuccessHandler(()=>{
        hideLoading(); toast('Berhasil disimpan');
        document.getElementById('inTanggal').value = '';
        document.getElementById('inNominal').value = '';
        document.getElementById('inKet').value = '';
      })
      .withFailureHandler(e=>{ hideLoading(); toast(e?.message || e); })
      .api_addTx(state.sessionId, payload);
  };
}

/* =========================
   RIWAYAT
========================= */
function renderRiwayat(){
  return `
    <div class="card">
      <div class="cardTitle">Filter Riwayat</div>
      <div class="cardSub">Atur periode dan UMKM</div>
      <div class="grid2">
        <div class="field"><label>Dari</label><input id="hStart" type="date" value="${esc(state.histStart)}"></div>
        <div class="field"><label>Sampai</label><input id="hEnd" type="date" value="${esc(state.histEnd)}"></div>
      </div>
      <div class="field"><label>UMKM</label><select id="hUmkm"><option value="ALL">Semua</option><option value="BENGKEL">Bengkel</option><option value="CUCIAN">Cucian</option></select></div>
      <div class="rowBtn"><button class="btn" id="btnHistApply">Terapkan</button><button class="btn" id="btnHistReset">Reset</button></div>
    </div>
    <div class="card">
      <div id="histList" class="empty">Memuat data...</div>
      <div class="pager"><button class="btn" id="btnPrev">Prev</button><button class="btn" id="btnNext">Next</button><div class="pagerInfo">Page: <b id="pno">${state.histPage}</b></div></div>
    </div>
  `;
}

function bindRiwayat(){
  const hUmkm = document.getElementById('hUmkm');
  if (hUmkm) hUmkm.value = state.histUmkm;
  document.getElementById('btnHistApply').onclick = ()=>{
    state.histStart = document.getElementById('hStart')?.value || '';
    state.histEnd = document.getElementById('hEnd')?.value || '';
    state.histUmkm = document.getElementById('hUmkm')?.value || 'ALL';
    state.histPage = 1; loadRiwayat();
  };
  document.getElementById('btnHistReset').onclick = ()=>{
    state.histStart = ''; state.histEnd = ''; state.histUmkm = 'ALL'; state.histPage = 1;
    document.getElementById('hStart').value = ''; document.getElementById('hEnd').value = ''; document.getElementById('hUmkm').value = 'ALL';
    loadRiwayat();
  };
  document.getElementById('btnPrev').onclick = ()=>{ if (state.histPage <= 1) return; state.histPage--; loadRiwayat(); };
  document.getElementById('btnNext').onclick = ()=>{ state.histPage++; loadRiwayat(); };
}

function txCard(tx){
  const tanggal = tx?.date || fmtYMD(tx?.dateObj);
  const umkm = String(tx?.umkm || '').toUpperCase();
  const tipe = String(tx?.type || '').toUpperCase();
  const method = String(tx?.method || '').toUpperCase();
  const nominal = fmtRp(tx?.amount || 0);
  const note = String(tx?.note || '-').trim();
  const user = tx.user ? `<div style="font-size:0.75rem; color:#666; margin-top:4px;">👤 ${esc(tx.user)}</div>` : '';
  return `
    <div class="txCard">
      <div class="txTitle">${esc(tanggal)} · ${esc(umkm)} · ${esc(tipe)}</div>
      <div class="txMeta">Metode: <b>${esc(method)}</b> · Nominal: <b>${esc(nominal)}</b></div>
      <div class="note">${esc(note)}</div>
      ${user}
      <div class="txBtns">
        <button class="btn" data-act="detail" data-txid="${esc(tx.txId)}">Detail</button>
        <button class="btn" data-act="edit" data-txid="${esc(tx.txId)}">Edit</button>
        <button class="btnDanger" data-act="del" data-txid="${esc(tx.txId)}">Hapus</button>
      </div>
    </div>
  `;
}

function bindRiwayatButtons(){
  const list = document.getElementById('histList');
  if (!list) return;
  list.querySelectorAll('[data-act="detail"]').forEach(btn => btn.onclick = ()=> openTxDetail(btn.dataset.txid));
  list.querySelectorAll('[data-act="edit"]').forEach(btn => btn.onclick = ()=> openTxEdit(btn.dataset.txid));
  list.querySelectorAll('[data-act="del"]').forEach(btn => btn.onclick = ()=> deleteTx(btn.dataset.txid));
}

function loadRiwayat(){
  const histListEl = document.getElementById('histList');
  if (!histListEl) return;
  histListEl.innerHTML = `<div class="empty">Memuat data...</div>`;
  showLoading('Memuat riwayat...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const items = Array.isArray(res?.items) ? res.items : [];
      histListEl.innerHTML = items.length ? items.map(txCard).join('') : `<div class="empty">Tidak ada transaksi</div>`;
      document.getElementById('pno').textContent = String(res.page || 1);
      document.getElementById('btnNext').disabled = !res.hasMore;
      document.getElementById('btnPrev').disabled = (state.histPage <= 1);
      bindRiwayatButtons();
    })
    .withFailureHandler(e=>{ hideLoading(); histListEl.innerHTML = `<div class="errText">API error: ${esc(e?.message||e)}</div>`; })
    .api_listTx(state.sessionId, { start: state.histStart, end: state.histEnd, umkm: state.histUmkm, page: state.histPage, pageSize: state.histPageSize });
}

function openTxDetail(txId){
  if (!txId) return;
  showLoading('Memuat detail...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const item = res?.item || res;
      if (!item?.txId) return toast('Data tidak ditemukan');
      showModal('Detail Transaksi', `
        <div class="field"><label>ID</label><div><b>${esc(item.txId)}</b></div></div>
        <div class="grid2"><div class="field"><label>Tanggal</label><div>${esc(item.date)}</div></div><div class="field"><label>UMKM</label><div>${esc(item.umkm)}</div></div></div>
        <div class="grid2"><div class="field"><label>Tipe</label><div>${esc(item.type)}</div></div><div class="field"><label>Metode</label><div>${esc(item.method)}</div></div></div>
        <div class="field"><label>Nominal</label><div><b>${esc(fmtRp(item.amount))}</b></div></div>
        <div class="field"><label>Keterangan</label><div>${esc(item.note||'-')}</div></div>
        <div class="field"><label>Dibuat Oleh</label><div>${esc(item.user||'-')}</div></div>
      `);
    })
    .withFailureHandler(e=>{ hideLoading(); toast(e); })
    .api_getTx(state.sessionId, txId);
}

function openTxEdit(txId){
  if (!txId) return;
  showLoading('Memuat data edit...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const item = res?.item || res;
      if (!item?.txId) return toast('Data tidak ditemukan');
      showModal('Edit Transaksi', `
        <form id="formEditTx">
          <div class="grid2"><div class="field"><label>Tanggal</label><input id="eTanggal" type="date" value="${esc(item.date)}"></div><div class="field"><label>UMKM</label><select id="eUmkm"><option value="BENGKEL">Bengkel</option><option value="CUCIAN">Cucian</option></select></div></div>
          <div class="grid2"><div class="field"><label>Tipe</label><select id="eType"><option value="PEMASUKAN">Pemasukan</option><option value="PENGELUARAN">Pengeluaran</option></select></div><div class="field"><label>Metode</label><select id="eMethod"><option value="CASH">Cash</option><option value="TRANSFER">Transfer</option></select></div></div>
          <div class="field"><label>Nominal</label><input id="eNominal" inputmode="numeric" value="${esc(item.amount)}"></div>
          <div class="field"><label>Keterangan</label><input id="eNote" value="${esc(item.note||'')}"></div>
          <div class="rowBtn"><button type="submit" class="btnPrimary full">Simpan Perubahan</button></div>
        </form>
      `);
      document.getElementById('eUmkm').value = item.umkm; document.getElementById('eType').value = item.type; document.getElementById('eMethod').value = item.method;
      document.getElementById('formEditTx').onsubmit = (ev)=>{
        ev.preventDefault();
        const payload = {
          txId: item.txId,
          tanggal: document.getElementById('eTanggal').value,
          umkm: document.getElementById('eUmkm').value,
          type: document.getElementById('eType').value,
          method: document.getElementById('eMethod').value,
          nominal: document.getElementById('eNominal').value,
          keterangan: document.getElementById('eNote').value
        };
        showLoading('Menyimpan perubahan...');
        google.script.run
          .withSuccessHandler(()=>{ hideLoading(); hideModal(); toast('Berhasil update'); loadRiwayat(); })
          .withFailureHandler(e=>{ hideLoading(); toast(e); })
          .api_updateTx(state.sessionId, payload);
      };
    })
    .withFailureHandler(e=>{ hideLoading(); toast(e); })
    .api_getTx(state.sessionId, txId);
}

function deleteTx(txId){
  if (!confirm('Hapus transaksi ini?')) return;
  showLoading('Menghapus...');
  google.script.run
    .withSuccessHandler(()=>{ hideLoading(); toast('Berhasil dihapus'); loadRiwayat(); })
    .withFailureHandler(e=>{ hideLoading(); toast(e); })

   ACTIVITY (Updated with Filter)

function renderActivity(){
  return `

      .logTopRow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: #555; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
      .logUser { font-weight: 600; color: #333; display: flex; align-items: center; gap: 5px; }
      .logTime { font-size: 0.85rem; color: #666; font-family: monospace; font-weight: 500;}
      .logContext { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }

      .logActionText { font-size: 0.95rem; color: #222; line-height: 1.4; }

      .logErr { border-left: 4px solid #dc3545; }
    </style>
    
    <div class="card">
      <div class="cardTitle">Filter Activity Log</div>

        <div class="field"><label>Sampai</label><input id="lEnd" type="date" value="${esc(state.logEnd)}"></div>
      </div>
      <div class="field"><label>UMKM</label><select id="lUmkm"><option value="ALL">Semua</option><option value="BENGKEL">Bengkel</option><option value="CUCIAN">Cucian</option></select></div>
      <div class="rowBtn"><button class="btn" id="btnLogApply">Terapkan</button><button class="btn" id="btnLogReset">Reset</button></div>
    </div>

    <div class="card">
      <div id="logList"></div>
      <div class="pager"><button class="btn" id="btnLogPrev">Prev</button><button class="btn" id="btnLogNext">Next</button><div class="pagerInfo">Page: <b id="lpno">${state.logPage}</b></div></div>
    </div>

}

function bindActivity(){
  const lUmkm = document.getElementById('lUmkm');
  if (lUmkm) lUmkm.value = state.logUmkm;

  document.getElementById('btnLogApply').onclick = ()=>{
    state.logStart = document.getElementById('lStart')?.value || '';
    state.logEnd = document.getElementById('lEnd')?.value || '';
    state.logUmkm = document.getElementById('lUmkm')?.value || 'ALL';
    state.logPage = 1; 
    loadActivity();
  };

  document.getElementById('btnLogReset').onclick = ()=>{
    state.logStart = ''; state.logEnd = ''; state.logUmkm = 'ALL'; state.logPage = 1;
    document.getElementById('lStart').value = ''; document.getElementById('lEnd').value = ''; document.getElementById('lUmkm').value = 'ALL';
    loadActivity();
  };

  document.getElementById('btnLogPrev').onclick = ()=>{ if (state.logPage <= 1) return; state.logPage--; loadActivity(); };
  document.getElementById('btnLogNext').onclick = ()=>{ state.logPage++; loadActivity(); };
}

function parseLog(action, detailObj) {
  const a = String(action || '');
  let page = 'Sistem', desc = 'Melakukan aktivitas pada sistem.', extra = '';
  if (a === 'API_LOGIN_OK') { page = 'Login'; desc = 'Berhasil masuk (Login) ke dalam aplikasi.'; }
  else if (a.includes('DASHBOARD')) { page = 'Dashboard'; desc = 'Melihat ringkasan dashboard.'; if (detailObj?.umkm && detailObj.umkm !== 'ALL') extra = `Filter UMKM: ${detailObj.umkm}`; }
  else if (a.includes('LIST_TX')) { page = 'Riwayat Transaksi'; desc = 'Melihat daftar riwayat transaksi.'; }
  else if (a.includes('ADD_TX')) { page = 'Input Transaksi'; let val = detailObj?.nominal; if (typeof val === 'string' && val.includes('.')) { val = val.replace(/\./g, ''); } const nominal = fmtRp(val || 0); const type = detailObj?.type || 'TRANSAKSI'; const umkm = detailObj?.umkm || ''; desc = `Menambahkan data ${type} baru untuk ${umkm} sebesar ${nominal}.`; }
  else if (a.includes('UPDATE_TX')) { page = 'Riwayat Transaksi'; desc = 'Mengubah (Edit) data transaksi lama.'; if (detailObj?.txId) extra = `ID Transaksi: ${detailObj.txId}`; }
  else if (a.includes('DELETE_TX')) { page = 'Riwayat Transaksi'; desc = 'Menghapus data transaksi.'; if (detailObj?.txId) extra = `ID Transaksi: ${detailObj.txId}`; }
  else if (a.includes('EXPORT')) { page = 'Dashboard'; const fmt = String(detailObj?.format || '').toUpperCase(); desc = `Mengunduh laporan keuangan dalam format ${fmt}.`; }
  else if (a.includes('USERS')) { page = 'Manage Akun'; desc = 'Melakukan manajemen data akun pengguna.'; }
  if (a.endsWith('_ERR')) { desc += ' (Gagal/Error)'; if (detailObj?.error) extra = `Pesan Error: ${detailObj.error}`; }
  return { page, desc, extra };
}

function loadActivity(){
  const listEl = document.getElementById('logList');
  if (!listEl) return;
  showLoading('Memuat log...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      const items = Array.isArray(res?.items) ? res.items : [];
      const visibleItems = items.filter(x => !String(x.action || x.ACTION || '').includes('VALIDATE'));
      listEl.innerHTML = visibleItems.map(x=>{
        let obj = {};
        const rawAction = x.action || x.ACTION; const rawDetail = x.detail || x.DETAIL;
        const rawTime = x.time || x.TIME || x.Time || x.created_at; const rawEmail = x.email || x.EMAIL;
        try{ obj = JSON.parse(rawDetail || '{}'); }catch(e){ obj = {}; }
        const { page, desc, extra } = parseLog(rawAction, obj?.detail || obj);
        const timeText = fmtDT(rawTime); const email = rawEmail || 'System'; const isErr = String(rawAction).includes('_ERR');
        return `
          <div class="logCard ${isErr ? 'logErr' : ''}">
            <div class="logTopRow"><span class="logUser">👤 ${esc(email)}</span><span class="logTime">📅 ${esc(timeText)}</span></div>
            <div class="logContext"><div class="badgePage">📍 ${esc(page)}</div><div class="logActionText">${esc(desc)}</div></div>
            ${ extra ? `<div class="logExtra">${esc(extra)}</div>` : '' }
          </div>
        `;
      }).join('') || `<div class="empty">Tidak ada aktivitas yang tercatat.</div>`;
      document.getElementById('lpno').textContent = String(res.page || 1);
      document.getElementById('btnLogNext').disabled = !res.hasMore;
      document.getElementById('btnLogPrev').disabled = state.logPage <= 1;
    })
    .withFailureHandler(e=>{ hideLoading(); toast(e?.message || e); })
    .api_activityList(state.sessionId, {
      page: state.logPage,
      pageSize: state.logPageSize,
      start: state.logStart,
      end: state.logEnd,
      umkm: state.logUmkm
    });
}

========================= */
function renderAkun(){
  return `
    <div class="card"><div class="cardTitle">Manage Akun</div><div class="cardSub">Masukkan admin key untuk membuka fitur admin</div><div class="field"><label>Admin Key</label><input id="adminKey" type="password" value="${esc(state.adminKey)}" /></div><div class="rowBtn"><button class="btnPrimary full" id="btnSaveKey">Simpan Key</button></div><div class="hint" id="adminHint"></div></div>
    <div class="card" id="adminArea" style="display:none;"><div class="rowBetween"><div><div class="cardTitle">Daftar Akun</div><div class="cardSub">Kelola pengguna aplikasi</div></div><button class="btnPrimary" id="btnAddUser">Tambah Akun</button></div><div id="userList"></div></div>
  `;
}

function bindAkun(){
  document.getElementById('btnSaveKey').onclick = ()=>{
    const key = document.getElementById('adminKey')?.value || '';
    if (!key) return toast('Admin key wajib diisi');
    state.adminKey = key; localStorage.setItem('adminKey', key); toast('Key disimpan'); loadUsers();
  };
}

function loadUsers(){
  const area = document.getElementById('adminArea'); const list = document.getElementById('userList'); const hint = document.getElementById('adminHint');
  if (!area || !list) return;
  showLoading('Memuat akun...');
  google.script.run
    .withSuccessHandler(res=>{
      hideLoading();
      if (!Array.isArray(res)) { if (hint) hint.textContent = 'Admin key salah.'; area.style.display = 'none'; return; }
      if (hint) hint.textContent = 'Admin key valid.'; area.style.display = 'block';
      list.innerHTML = res.map(u=>`
        <div class="userCard">
          <div class="userTop">
            <div><div class="userName">${esc(u.name)} <span class="muted">(${esc(u.email)})</span></div><div class="muted">Role: <b>${esc(u.role)}</b> · Status: ${u.isActive?'Aktif':'Nonaktif'}</div></div>
            <div class="userBadge">${u.isActive?'ACTIVE':'OFF'}</div>
          </div>
          <div class="txBtns"><button class="btn" data-uact="edit" data-uid="${esc(u.userId)}">Edit</button><button class="btnDanger" data-uact="del" data-uid="${esc(u.userId)}">Hapus</button></div>
        </div>
      `).join('') || `<div class="empty">Belum ada akun</div>`;
      document.getElementById('btnAddUser').onclick = ()=> openUserModal();
      list.querySelectorAll('[data-uact="edit"]').forEach(b => b.onclick = ()=> openUserModal(res.find(x=>x.userId===b.dataset.uid)));
      list.querySelectorAll('[data-uact="del"]').forEach(b => b.onclick = ()=> deleteUser(b.dataset.uid));
    })
    .withFailureHandler(e=>{ hideLoading(); toast(e); })
    .api_usersList(state.sessionId, state.adminKey);
}

function openUserModal(user){
  const isEdit = !!user;
  showModal(isEdit ? 'Edit Akun' : 'Tambah Akun', `
    <form id="frmUser">
      <div class="field"><label>Email</label><input id="uEmail" type="email" value="${esc(user?.email||'')}" ${isEdit?'disabled':''}/></div>
      <div class="field"><label>Nama</label><input id="uName" value="${esc(user?.name||'')}" /></div>
      <div class="field"><label>Role</label><select id="uRole"><option value="ADMIN">ADMIN (Hanya Input & Riwayat)</option><option value="OWNER">OWNER (Akses Penuh)</option></select></div>
      <div class="field"><label>Password ${isEdit?'(kosongkan jika tidak ganti)':''}</label><input id="uPass" type="password" /></div>
      <div class="field"><label>Status</label><select id="uActive"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div>
      <div class="rowBtn"><button class="btnPrimary full" type="submit">${isEdit?'Simpan':'Tambah'}</button></div>
    </form>
  `);
  document.getElementById('uActive').value = user?.isActive===false ? '0' : '1';
  document.getElementById('uRole').value = user?.role || 'ADMIN';
  document.getElementById('frmUser').onsubmit = (ev)=>{
    ev.preventDefault();
    const payload = { userId: user?.userId || '', email: document.getElementById('uEmail').value, name: document.getElementById('uName').value, password: document.getElementById('uPass').value, isActive: document.getElementById('uActive').value === '1', role: document.getElementById('uRole').value };
    showLoading('Menyimpan...');
    google.script.run
      .withSuccessHandler(()=>{ hideLoading(); hideModal(); toast('Berhasil'); loadUsers(); })
      .withFailureHandler(e=>{ hideLoading(); toast(e); })
      .api_usersUpsert(state.sessionId, state.adminKey, payload);
  };
}

function deleteUser(uid){
  if (!confirm('Hapus akun?')) return;
  showLoading('Menghapus...');
  google.script.run
    .withSuccessHandler(()=>{ hideLoading(); toast('Dihapus'); loadUsers(); })
    .withFailureHandler(e=>{ hideLoading(); toast(e); })
    .api_usersDelete(state.sessionId, state.adminKey, uid);
}

/* =========================
   CHART JS HELPERS (UPDATED)
========================= */
function renderCharts_(data, summaryData) {
  if (!data) return;

  // 1. Grafik TREN (Line Chart)
  renderOneChart_('chartTrend', 'line', {
    labels: data.trend.map(x => fmtDate_(x.date)), 
    datasets: [
      {
        label: 'Pemasukan',
        data: data.trend.map(x => x.income),
        borderColor: '#28a745',
        backgroundColor: 'rgba(40, 167, 69, 0.1)',
        tension: 0.3,
        fill: true
      },
      {
        label: 'Pengeluaran',
        data: data.trend.map(x => x.expense),
        borderColor: '#dc3545',
        backgroundColor: 'rgba(220, 53, 69, 0.1)',
        tension: 0.3,
        fill: true
      }
    ]
  });

  // 2. Grafik Pertumbuhan Laba (Line Chart Bulanan)
  if (data.profitGrowth) {
    renderOneChart_('chartProfitGrowth', 'line', {
      labels: data.profitGrowth.map(x => fmtMonth_(x.label)),
      datasets: [{
        label: 'Laba Bersih',
        data: data.profitGrowth.map(x => x.value),
        borderColor: '#007bff',
        backgroundColor: 'rgba(0, 123, 255, 0.1)',
        tension: 0.3,
        fill: true
      }]
    });
  }
}

function renderOneChart_(canvasId, type, dataConfig) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return; 

  if (_chartInstances[canvasId]) {
    _chartInstances[canvasId].destroy();
  }

  _chartInstances[canvasId] = new Chart(ctx, {
    type: type,
    data: dataConfig,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' }
      },
      scales: (type === 'line' || type === 'bar') ? { y: { beginAtZero: true } } : {}
    }
  });
}

function fmtDate_(isoDate) {
  if (!isoDate) return '-';
  const d = new Date(isoDate);
  if (isNaN(d)) return isoDate;
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
  return d.getDate() + ' ' + monthNames[d.getMonth()];
}

function fmtMonth_(ym) {
  if (!ym) return '-';
  // Input: YYYY-MM
  const parts = ym.split('-');
  if (parts.length < 2) return ym;
  const y = parts[0];
  const m = parseInt(parts[1], 10) - 1;
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
  return `${monthNames[m]} ${y}`;
}

mount();
